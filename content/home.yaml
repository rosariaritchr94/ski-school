hero:
  sopratitolo1: "SCUOLA DI SCI"
  sopratitolo2: "& SNOWBOARD"
  titolo: "Gran Paradiso"
intro:
  titolo: "THE\nWILD SIDE\nOF SKIING"
  testo: "A Cogne lo sci è pura libertà. Qui, ai piedi del Gran Paradiso, ogni curva è un’avventura: che tu sia alle prime discese o un esperto della tecnica, con noi vivi lo sci nel suo lato più adrenalinico. Bambini, ragazzi, adulti: ognuno trova la sua sfida e il suo divertimento. La Scuola di Sci Gran Paradiso è il posto dove imparare, ridere e condividere emozioni vere, circondati dai paesaggi più spettacolari della Valle d’Aosta. Ready to ride the wild side?"
  video: "/foto/home/intro-reel.mp4"
servizi:
  - titolo: "lezioni private"
    testo: "Sci alpino e snowboard - Lezioni personalizzate con maestro dedicato, per bambini e adulti, per imparare e migliorare la tecnica nello sci, nello snowboard e nello sci di fondo."
    foto: "/foto/home/servizi-lezioni-private.jpg"
    link: "/lezioni#lezioni-individuali"
    mostraPreventivo: false
    scrittaSuFoto: ""
    etichettaLive: false
  - titolo: "FONDO E TELEMARK"
    testo: "Lezioni pensate per chi ama conoscere o approfondire lo sci di fondo, con tempi ridotti per dedicare attenzione ad ogni dettaglio."
