intro:
  titolo:
    it: "THE\nWILD SIDE\nOF SKIING"
    en: "THE\nWILD SIDE\nOF SKIING"
    fr: "THE\nWILD SIDE\nOF SKIING"
  testo:
    it: "A Cogne lo sci è pura libertà. Qui, ai piedi del Gran Paradiso, ogni curva è un’avventura: che tu sia alle prime discese o un esperto della tecnica, con noi vivi lo sci nel suo lato più adrenalinico. Bambini, ragazzi, adulti: ognuno trova la sua sfida e il suo divertimento. La Scuola di Sci Gran Paradiso è il posto dove imparare, ridere e condividere emozioni vere, circondati dai paesaggi più spettacolari della Valle d’Aosta. Ready to ride the wild side?"
    en: "In Cogne, skiing is pure freedom. Here, at the foot of the Gran Paradiso, every turn is an adventure: whether you are taking your first runs or already an expert, with us you experience skiing at its most thrilling. Children, teenagers, adults: everyone finds their own challenge and their own fun. The Gran Paradiso Ski School is the place to learn, laugh and share real emotions, surrounded by the most spectacular scenery in the Aosta Valley. Ready to ride the wild side?"
    fr: "À Cogne, le ski, c’est la liberté à l’état pur. Ici, au pied du Grand-Paradis, chaque virage est une aventure : que vous fassiez vos premières descentes ou que vous maîtrisiez déjà la technique, avec nous vous vivez le ski dans ce qu’il a de plus intense. Enfants, ados, adultes : chacun trouve son défi et son plaisir. L’École de Ski Gran Paradiso est l’endroit idéal pour apprendre, rire et partager de vraies émotions, entourés des paysages les plus spectaculaires de la Vallée d’Aoste. Ready to ride the wild side?"
  video: "/foto/home/intro-reel.mp4"
