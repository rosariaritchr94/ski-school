sicurezza:
  titolo:
    it: "Vivi\nl’avventura\nin totale\nsicurezza"
    en: "Live\nthe adventure\nin complete\nsafety"
    fr: "Vivez\nl’aventure\nen toute\nsécurité"
  testo:
    it: "I nostri maestri della Scuola di Sci Gran Paradiso sono sempre pronti ad accompagnarti: programmi personalizzati e lezioni dedicate a bambini e adulti, all’insegna di professionalità, esperienza e sicurezza. Tutto ciò che ti serve per vivere una vacanza indimenticabile a Cogne, nel cuore della Valle d’Aosta."
    en: "Our Gran Paradiso Ski School instructors are always ready to accompany you: tailor-made programmes and lessons for children and adults, built on professionalism, experience and safety. Everything you need for an unforgettable holiday in Cogne, in the heart of the Aosta Valley."
    fr: "Les moniteurs de l’École de Ski Gran Paradiso sont toujours prêts à vous accompagner : programmes personnalisés et cours dédiés aux enfants et aux adultes, sous le signe du professionnalisme, de l’expérience et de la sécurité. Tout ce qu’il vous faut pour des vacances inoubliables à Cogne, au cœur de la Vallée d’Aoste."
