collettive:
  titolo:
    it: "Lezioni\ncollettive"
    en: "Group\nlessons"
    fr: "Cours\ncollectifs"
  testo:
    it: "Una soluzione adatta a tutti coloro che vogliono condividere con nuovi amici la passione per lo sci o per lo snowboard. Ideale per bambini e adulti, dai primi passi sulla neve fino agli amanti delle piste più impegnative."
    en: "The perfect choice for anyone who wants to share their passion for skiing or snowboarding with new friends. Ideal for children and adults, from first steps on the snow to lovers of the most challenging slopes."
    fr: "La formule idéale pour tous ceux qui veulent partager leur passion du ski ou du snowboard avec de nouveaux amis. Parfaite pour enfants et adultes, des premiers pas sur la neige jusqu’aux amateurs des pistes les plus exigeantes."
