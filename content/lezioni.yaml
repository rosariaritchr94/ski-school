collettive:
  titolo: "Lezioni\ncollettive"
  testo: "Una soluzione adatta a tutti coloro che vogliono condividere con nuovi amici la passione per lo sci o per lo snowboard. Ideale per bambini e adulti, dai primi passi sulla neve fino agli amanti delle piste più impegnative."
  discipline:
    - alpino
    - nordico
  foto: "/foto/lezioni/collettive.jpg"
  tariffeTitolo: "Tariffe e modalità"
  tariffeTesto: "Le lezioni collettive sono organizzate per livelli omogenei, con gruppi ridotti per garantire sicurezza e divertimento. La partecipazione è garantita con un minimo di 4 iscritti per corso."
  tabellaTitolo: "Lezioni collettive"
  righe:
    - disciplina: "Sci alpino"
      orario: "seggiovia 10:00 – 12:00"
      pacchetto: "1 giorno"
      tariffa: "60 €"
    - disciplina: "Sci alpino"
      orario: "seggiovia 11:00 – 13:00"
      pacchetto: "3 giorni"
      tariffa: "155 €"
    - disciplina: "Sci alpino"
      orario: "baby park 11:00 – 13:00"
      pacchetto: "5 giorni"
      tariffa: "230 €"
    - disciplina: "Sci nordico"
      orario: "13:00 – 15:00"
      pacchetto: "7 giorni"
      tariffa: "310 €"
  nota: "*Sconto del 10% sul secondo figlio iscritto allo stesso corso."
snowcare:
  titolo: "Assicurazione\nSnowcare –"
  titoloColorato: "proteggi la tua\nprenotazione!"
  paragrafi:
    - "Con l’assicurazione Snowcare puoi tutelare la tua vacanza e le tue lezioni di sci in caso di infortunio o imprevisti. È una copertura pensata per chi frequenta la montagna sulla neve e desidera vivere le proprie giornate in sicurezza e serenità."
    - "Chiedi maggiori informazioni alla segreteria al momento della prenotazione o il giorno stesso della lezione."
  foto: "/foto/lezioni/snowcare.jpg"
pagamenti:
  titolo: "Cancellazioni & pagamenti"
  paragrafi:
    - "Le lezioni si considerano confermate al momento della prenotazione. In caso di impossibilità a partecipare, ti chiediamo di avvisarci il prima possibile: le disdette comunicate con almeno 24 ore di anticipo non comportano penali, mentre oltre tale termine la lezione sarà addebitata."
    - "Il pagamento può essere effettuato in segreteria, in contanti, carta o bancomat, oppure tramite bonifico anticipato secondo le indicazioni che riceverai al momento della conferma."
ritrovo:
  titolo: "Orari &\nluoghi di ritrovo"
  testo: "I punti di ritrovo variano in base al tipo di corso e al livello. Nella mappa trovi indicati i luoghi principali di incontro con i maestri e gli orari di riferimento. Ti consigliamo di presentarti con qualche minuto di anticipo."
