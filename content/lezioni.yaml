individuali:
  titolo:
    it: "Lezioni\nprivate"
    en: "Private\nlessons"
    fr: "Cours\nparticuliers"
  testo:
    it: "Cosa c’è di meglio di una lezione personalizzata e su misura per poter scoprire i segreti nascosti dello sci e dello snowboard? Grazie ai nostri maestri potrai acquisire maggiore confidenza ed abilità in ogni disciplina proposta, in un contesto naturale, sicuro e unico come quello del Gran Paradiso. Scegli tra queste attività e prenota la tua lezione:"
    en: "What could be better than a personalised, tailor-made lesson to discover the hidden secrets of skiing and snowboarding? With our instructors you will gain more confidence and skill in every discipline we offer, in a natural, safe and unique setting like the Gran Paradiso. Choose from these activities and book your lesson:"
    fr: "Quoi de mieux qu’un cours personnalisé et sur mesure pour découvrir les secrets du ski et du snowboard ? Avec nos moniteurs, vous gagnerez en confiance et en aisance dans chaque discipline proposée, dans un cadre naturel, sûr et unique comme celui du Grand-Paradis. Choisissez parmi ces activités et réservez votre cours :"
  discipline:
  - alpino
  - snowboard
  - nordico
  foto: "/foto/lezioni/individuali.jpg"
