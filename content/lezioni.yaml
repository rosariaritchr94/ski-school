snowcare:
  titolo:
    it: "Assicurazione\nSnowcare –"
    en: "Snowcare\ninsurance –"
    fr: "Assurance\nSnowcare –"
  titoloColorato:
    it: "proteggi la tua\nprenotazione!"
    en: "protect your\nbooking!"
    fr: "protégez votre\nréservation !"
  paragrafi:
  - it: "Con l’assicurazione Snowcare puoi tutelare la tua vacanza e le tue lezioni di sci in caso di infortunio o imprevisti. È una copertura pensata per chi frequenta la montagna sulla neve e desidera vivere le proprie giornate in sicurezza e serenità."
    en: "With Snowcare insurance you can protect your holiday and your ski lessons in case of injury or unforeseen events. It is cover designed for people who spend time on the snow and want to enjoy their days safely and with peace of mind."
    fr: "Avec l’assurance Snowcare, vous protégez vos vacances et vos cours de ski en cas de blessure ou d’imprévu. Une couverture pensée pour ceux qui fréquentent la montagne enneigée et veulent profiter de leurs journées en toute sécurité et sérénité."
  - it: "Chiedi maggiori informazioni alla segreteria al momento della prenotazione o il giorno stesso della lezione."
    en: "Ask our office for more information when you book or on the day of your lesson."
    fr: "Renseignez-vous auprès du secrétariat lors de la réservation ou le jour même du cours."
  foto: "/foto/lezioni/snowcare-ffff41.jpg"
  scheda:
    ita: "/foto/lezioni/snowcare/scheda-it.pdf"
    eng: "/foto/lezioni/snowcare/scheda-en.pdf"
    fra: "/foto/lezioni/snowcare/scheda-fr.pdf"
  schedaImmagine:
    ita: "/foto/lezioni/snowcare/scheda-it.jpg"
    eng: "/foto/lezioni/snowcare/scheda-en.jpg"
    fra: "/foto/lezioni/snowcare/scheda-fr.jpg"
pagamenti:
  titolo:
    it: "Cancellazioni & pagamenti"
    en: "Cancellations & payments"
    fr: "Annulations & paiements"
  paragrafi:
  - it: "Le lezioni si considerano confermate al momento della prenotazione. In caso di impossibilità a partecipare, ti chiediamo di avvisarci il prima possibile: le disdette comunicate con almeno 24 ore di anticipo non comportano penali, mentre oltre tale termine la lezione sarà addebitata."
    en: "Lessons are confirmed at the time of booking. If you cannot attend, please let us know as soon as possible: cancellations made at least 24 hours in advance are free of charge, after that the lesson will be charged."
    fr: "Les cours sont confirmés au moment de la réservation. Si vous ne pouvez pas venir, merci de nous prévenir le plus tôt possible : les annulations communiquées au moins 24 heures à l’avance sont sans frais ; au-delà, le cours sera facturé."
  - it: "Il pagamento può essere effettuato in segreteria, in contanti, carta o bancomat, oppure tramite bonifico anticipato secondo le indicazioni che riceverai al momento della conferma."
    en: "Payment can be made at the office in cash or by card, or in advance by bank transfer following the instructions you will receive with your confirmation."
    fr: "Le paiement peut être effectué au secrétariat, en espèces ou par carte bancaire, ou par virement anticipé selon les indications reçues lors de la confirmation."
ritrovo:
  titolo:
    it: "Orari &\nluoghi di ritrovo"
    en: "Times &\nmeeting points"
    fr: "Horaires &\npoints de rendez-vous"
  testo:
    it: "I punti di ritrovo variano in base al tipo di corso e al livello. Nella mappa trovi indicati i luoghi principali di incontro con i maestri e gli orari di riferimento. Ti consigliamo di presentarti con qualche minuto di anticipo."
    en: "Meeting points vary depending on the type of course and level. The map shows the main places where you meet your instructors and the reference times. We recommend arriving a few minutes early."
    fr: "Les points de rendez-vous varient selon le type de cours et le niveau. La carte indique les principaux lieux de rencontre avec les moniteurs et les horaires de référence. Nous vous conseillons d’arriver quelques minutes en avance."
