    en: "Group courses during Peak season, with qualified instructors. Lessons are organised by level, in small groups to guarantee safety and fun. Each course runs with a minimum of 4 participants."
    fr: "Cours collectifs pendant la Très haute saison, avec des moniteurs diplômés. Les cours sont organisés par niveaux homogènes, en petits groupes pour garantir sécurité et plaisir. Chaque cours est assuré à partir de 4 inscrits."
