  titolo: "Lezioni\nprivate"
  testo: "Cosa c’è di meglio di una lezione personalizzata e su misura per poter scoprire i segreti nascosti dello sci e dello snowboard? Grazie ai nostri maestri potrai acquisire maggiore confidenza ed abilità in ogni disciplina proposta, in un contesto naturale, sicuro e unico come quello del Gran Paradiso. Scegli tra queste attività e prenota la tua lezione:"
